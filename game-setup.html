<!DOCTYPE html>
<html lang="es-AR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CronIQ - Nueva partida</title>
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	<header>
		<a class="back-link" href="index.html">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
		</a>
		<h1>Nueva partida</h1>
	</header>

	<main>
		<form id="setup-form">
			<section>
				<h2>Grupos</h2>
				<ul id="group-list" class="group-list"></ul>
				<button id="add-group-button" class="button button-ghost button-large button-add" type="button">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
					Agregar grupo
				</button>
			</section>

			<p id="setup-errors" class="alert" role="alert" hidden></p>

			<button class="button button-primary button-large" type="submit">
				Empezar partida
			</button>
		</form>
	</main>

	<template id="group-template">
		<li class="group-item">
			<button class="remove-group-button icon-button icon-button-danger" type="button" aria-label="Quitar grupo">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
			</button>

			<div class="color-swatches"></div>
			<label class="field">
				<input class="group-name-input" type="text" required  style="border-radius: 999px;">
			</label>
			
			<button type="button" class="pack-summary-button">
				<span class="pack-summary-text">Elegir packs…</span>
			</button>
		</li>
	</template>

	<dialog id="pack-picker-dialog" class="pack-picker-dialog">
		<h3>Elegir packs</h3>
		<div id="pack-picker-options" class="pack-picker-options"></div>
		<div class="dialog-actions">
			<button id="pack-picker-confirm" class="button button-primary" type="button">Listo</button>
		</div>
	</dialog>

	<script type="module" src="js/setup/setup-app.js"></script>
</body>
</html>
