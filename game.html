<!DOCTYPE html>
<html lang="es-AR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CronIQ - Partida</title>
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	<header>
		<a class="back-link" href="index.html">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
		</a>
		<h1>Partida</h1>
	</header>

	<main class="stats-view">
		<section id="play-section">
			<div class="score-wheel-card">
				<div id="score-wheel" class="score-wheel"></div>
				<ul id="score-wheel-legend" class="score-wheel-legend"></ul>
			</div>

			<div id="draw-controls">
				<button id="draw-question-button" class="button button-primary button-large roll-button" type="button">
					Sacar pregunta
				</button>
			</div>

			<button id="finish-game-button" class="button button-ghost button-large" type="button">
				Finalizar partida
			</button>

			<ul id="team-card-list" class="team-card-list"></ul>
		</section>

		<section id="ranking-section" hidden>
			<h2>Resultado final</h2>
			<ol id="ranking-list" class="scoreboard-bar"></ol>
			<a class="button button-primary button-large" href="pack-select.html">Nueva partida</a>
		</section>
	</main>

	<dialog id="question-modal" class="question-modal">
		<div class="question-modal-header">
			<p id="feedback-message" class="feedback-message"></p>
			<p id="question-text" class="question-text"></p>
		</div>
		<div class="question-modal-body">
			<div id="options-list" class="options-grid"></div>
			<button id="confirm-button" class="button button-ghost button-large" type="button">
				Confirmar
			</button>
		</div>
	</dialog>

	<script type="module" src="js/game/game-app.js"></script>
</body>
</html>
