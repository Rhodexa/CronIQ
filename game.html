<!DOCTYPE html>
<html lang="es-AR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CronIQ - Partida</title>
	<link rel="stylesheet" href="css/main.css">
</head>
<body>
	<header>
		<a class="back-link" href="index.html">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
		</a>
		<h1>Partida</h1>
	</header>

	<main>
		<section id="scoreboard-section">
			<h2>Puntajes</h2>
			<ul id="scoreboard-list"></ul>
		</section>

		<section id="play-section">
			<p id="turn-indicator"></p>
			<p id="feedback-message"></p>

			<div id="draw-controls">
				<label id="pack-override-label" hidden>
					Elegir pack
					<select id="pack-override-select"></select>
				</label>
				<button id="draw-question-button" type="button">Sacar pregunta</button>
			</div>

			<div id="question-display" hidden>
				<p id="question-text"></p>
				<ul id="options-list"></ul>
			</div>

			<div id="gm-controls">
				<label>
					Forzar turno de
					<select id="group-override-select"></select>
				</label>
				<button id="override-group-button" type="button">Forzar turno</button>
			</div>

			<button id="finish-game-button" type="button">Finalizar partida</button>
		</section>

		<section id="ranking-section" hidden>
			<h2>Resultado final</h2>
			<ol id="ranking-list"></ol>
			<a href="pack-select.html">Nueva partida</a>
		</section>
	</main>

	<script type="module" src="js/game/game-app.js"></script>
</body>
</html>
